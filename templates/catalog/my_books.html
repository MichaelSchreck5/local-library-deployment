
{% extends "catalog/base.html" %}

{% block content %}
  <h1>My Books</h1>

  {% if bookinstance_list %}
    <ul>
      {% for bookinst in bookinstance_list %}
        <li>
          <a href="{% url 'book-detail' bookinst.book.pk %}">
            {{ bookinst.book.title }}
          </a>
          (Due: {{ bookinst.due_back }})
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no books borrowed.</p>
  {% endif %}
{% endblock %}
